name: Test

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-versions:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.v.outputs.GO_VERSION }}
      node: ${{ steps.v.outputs.NODE_VERSION }}
      golangci-lint: ${{ steps.v.outputs.GOLANGCI_LINT_VERSION }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/versions.env
          sparse-checkout-cone-mode: false
      - id: v
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* ]] && continue
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done < .github/versions.env

  test-backend:
    runs-on: ubuntu-latest
    needs: [load-versions]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.load-versions.outputs.go }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.load-versions.outputs.node }}
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - name: Go lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ needs.load-versions.outputs.golangci-lint }}
      - run: go test ./...
      - name: Build frontend
        run: cd web && npm ci && npm run build
      - name: Build binary
        run: CGO_ENABLED=0 go build -o nidus ./cmd/nidus/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nidus-build
          path: |
            nidus
            web/static/
          retention-days: 1

  test-frontend:
    runs-on: ubuntu-latest
    needs: [load-versions]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.load-versions.outputs.node }}
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - run: cd web && npm ci
      - run: cd web && npm run lint
      - name: Svelte check
        run: cd web && npx svelte-check --tsconfig ./tsconfig.app.json
      - run: cd web && npm test -- --run

  test-e2e:
    runs-on: ubuntu-latest
    needs: [load-versions, test-backend]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.load-versions.outputs.node }}
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: nidus-build
      - run: chmod +x nidus
      - run: cd web && npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd web && npx playwright install --with-deps chromium
      - name: Install Playwright deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd web && npx playwright install-deps chromium
      - run: mkdir -p data
      - name: Run E2E tests
        run: cd web && npx playwright test --project=auth-setup --project=e2e
      - name: Show server logs
        if: failure()
        run: cat /tmp/nidus-e2e.log 2>/dev/null || echo "No server log"
      - name: Upload report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  notify:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-e2e]
    if: failure()
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/gotify
        with:
          title: 'Tests FAILED on ${{ github.ref_name }}'
          message: 'Tests failed on branch ${{ github.ref_name }}. Check: github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          priority: '8'
          token: ${{ secrets.GOTIFY_TOKEN }}

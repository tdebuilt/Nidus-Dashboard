name: Release Desktop

on:
  workflow_run:
    workflows: ['Release Docker']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.1)'
        required: true

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/nidus-dashboard
  TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}

jobs:
  load-versions:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      go: ${{ steps.v.outputs.GO_VERSION }}
      node: ${{ steps.v.outputs.NODE_VERSION }}
      go2rtc: ${{ steps.v.outputs.GO2RTC_VERSION }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.tag }}
          sparse-checkout: .github/versions.env
          sparse-checkout-cone-mode: false
      - id: v
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* ]] && continue
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done < .github/versions.env

  build-frontend:
    runs-on: ubuntu-latest
    needs: [load-versions]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.load-versions.outputs.node }}
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-static
          path: web/static/

  build-go:
    needs: [load-versions, build-frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            triple: x86_64-unknown-linux-gnu
            go2rtc_asset: go2rtc_linux_amd64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            triple: x86_64-apple-darwin
            go2rtc_asset: go2rtc_mac_amd64.zip
            runner: ubuntu-latest
          - goos: darwin
            goarch: arm64
            triple: aarch64-apple-darwin
            go2rtc_asset: go2rtc_mac_arm64.zip
            runner: ubuntu-latest
          - goos: windows
            goarch: amd64
            triple: x86_64-pc-windows-msvc
            ext: .exe
            go2rtc_asset: go2rtc_win64.zip
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.load-versions.outputs.go }}

      - name: Download frontend build
        uses: actions/download-artifact@v7
        with:
          name: web-static
          path: web/static/

      - name: Build Go binary
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.Version=${{ env.TAG }}" -o nidus-${{ matrix.triple }}${{ matrix.ext }} ./cmd/nidus/

      - name: Download go2rtc binary
        run: |
          mkdir -p dist
          GO2RTC_URL="https://github.com/AlexxIT/go2rtc/releases/download/v${{ needs.load-versions.outputs.go2rtc }}/${{ matrix.go2rtc_asset }}"
          if [[ "${{ matrix.go2rtc_asset }}" == *.zip ]]; then
            wget -q -O go2rtc.zip "$GO2RTC_URL"
            unzip -o go2rtc.zip -d dist/
          else
            wget -q -O dist/go2rtc "$GO2RTC_URL"
            chmod +x dist/go2rtc
          fi

      - name: Bundle release archive
        run: |
          mkdir -p bundle
          cp nidus-${{ matrix.triple }}${{ matrix.ext }} bundle/
          cp dist/go2rtc* bundle/
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            cd bundle && zip ../nidus-${{ matrix.triple }}.zip * && cd ..
          else
            tar -czf nidus-${{ matrix.triple }}.tar.gz -C bundle .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: nidus-${{ matrix.triple }}
          path: |
            nidus-${{ matrix.triple }}${{ matrix.ext }}
            nidus-${{ matrix.triple }}.tar.gz
            nidus-${{ matrix.triple }}.zip
          if-no-files-found: ignore

  build-tauri:
    needs: [load-versions, build-go]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - platform: macos-latest
            triple: aarch64-apple-darwin
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.tag }}

      - name: Download Go sidecar binary
        uses: actions/download-artifact@v7
        with:
          name: nidus-${{ matrix.triple }}
          path: desktop/src-tauri/binaries/

      - name: Make sidecar executable
        if: runner.os != 'Windows'
        run: chmod +x desktop/src-tauri/binaries/nidus-${{ matrix.triple }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.load-versions.outputs.node }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ env.TAG }}
          releaseName: 'Nidus ${{ env.TAG }}'
          releaseBody: 'Download the installer for your platform below, or use Docker: `docker pull ${{ env.REGISTRY_IMAGE }}:${{ env.TAG }}`'
          releaseDraft: false
          prerelease: false

  release-binaries:
    needs: [build-go, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Download all Go artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          pattern: nidus-*

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          tag_name: ${{ env.TAG }}

  notify-success:
    runs-on: ubuntu-latest
    needs: [release-binaries]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/gotify
        with:
          title: 'Desktop ${{ env.TAG }}'
          message: 'Desktop builds attached to release successfully'
          priority: '5'
          token: ${{ secrets.GOTIFY_TOKEN }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-go, build-tauri, release-binaries]
    if: failure()
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/gotify
        with:
          title: 'Desktop ${{ env.TAG }} FAILED'
          message: 'Desktop build failed. Check: github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          priority: '8'
          token: ${{ secrets.GOTIFY_TOKEN }}

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.6.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/nidus-dashboard

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build-docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ inputs.version }}
          git push origin ${{ inputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ inputs.version }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ inputs.version }}
            ${{ env.REGISTRY_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          generate_release_notes: true

      - name: Notify success
        if: success()
        run: |
          curl -s "https://gotify.tdelab.eu/message?token=${{ secrets.GOTIFY_TOKEN }}" \
            -F "title=Release ${{ inputs.version }}" \
            -F "message=Docker image pushed successfully" \
            -F "priority=5"

      - name: Notify failure
        if: failure()
        run: |
          curl -s "https://gotify.tdelab.eu/message?token=${{ secrets.GOTIFY_TOKEN }}" \
            -F "title=Release ${{ inputs.version }} FAILED" \
            -F "message=Build failed. Check: github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "priority=8"

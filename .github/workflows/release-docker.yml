name: Release Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.6.0)'
        required: true
        type: string

concurrency:
  group: release-docker
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/nidus-dashboard
  VERSION: ${{ github.event.release.tag_name || inputs.version }}

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ env.VERSION }}
            ${{ env.REGISTRY_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache,mode=max

  notify-success:
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/gotify
        with:
          title: 'Release ${{ env.VERSION }}'
          message: 'Docker image pushed successfully'
          priority: '5'
          token: ${{ secrets.GOTIFY_TOKEN }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: failure()
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/gotify
        with:
          title: 'Release ${{ env.VERSION }} FAILED'
          message: 'Build failed. Check: github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          priority: '8'
          token: ${{ secrets.GOTIFY_TOKEN }}

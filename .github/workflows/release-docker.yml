name: Release Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.6.0)'
        required: true
        type: string

concurrency:
  group: release-docker
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/nidus-dashboard
  VERSION: ${{ github.event.release.tag_name || inputs.version }}

jobs:
  create-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create tag
        run: |
          git tag "${{ env.VERSION }}"
          git push origin "${{ env.VERSION }}"

      - name: Determine prerelease
        id: pre
        run: |
          if [[ "${{ env.VERSION }}" == *"-"* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        run: |
          gh release create "${{ env.VERSION }}" \
            --title "Release ${{ env.VERSION }}" \
            --generate-notes \
            ${{ steps.pre.outputs.flag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          VER: ${{ env.VERSION }}
        run: |
          TAGS="${IMAGE}:${VER}"
          if [[ "${VER}" != *"-"* ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache,mode=max

  notify-success:
    runs-on: ubuntu-latest
    needs: [create-release, build-docker]
    if: always() && needs.build-docker.result == 'success'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/gotify
        with:
          title: 'Release ${{ env.VERSION }}'
          message: 'Docker image pushed successfully'
          priority: '5'
          token: ${{ secrets.GOTIFY_TOKEN }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: [create-release, build-docker]
    if: always() && (needs.create-release.result == 'failure' || needs.build-docker.result == 'failure')
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/gotify
        with:
          title: 'Release ${{ env.VERSION }} FAILED'
          message: 'Build failed. Check: github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          priority: '8'
          token: ${{ secrets.GOTIFY_TOKEN }}
